
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Título de la pestaña del navegador -->
    <title>Eliminar Clase</title>

    <!-- Bootstrap 5: estilos y utilidades -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome: iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ===============================
           FONDO DE LA PÁGINA
           ===============================
           - Imagen institucional del sistema
           - Degradado oscuro para legibilidad
        */
        body{
            background:
                linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
                url("https://inticap.com/portal/images/sistema/facturacion/logos/Sistema_Gimnasio.png")
                no-repeat center center fixed;
            background-size: cover;
        }

        /* ===============================
           TARJETA DE CONFIRMACIÓN
           ===============================
           - Diseño tipo alerta
           - Colores de peligro
        */
        .delete-card{
            max-width: 500px;
            background: #fff;
            border-radius: 20px;
            padding: 35px;
            border-top: 6px solid #dc3545;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100">
<!--
    Centrado total usando Flexbox
-->

<!-- CONTENEDOR PRINCIPAL -->
<div class="delete-card text-center shadow-lg">

    <!-- ÍCONO + EMOJI (DIFERENTE AL DE MIEMBRO) -->
    <h2 class="mb-3" style="font-size: 3rem;">
        🥺🏋️‍♂️
    </h2>

    <!-- MENSAJE DE CONFIRMACIÓN -->
    <h4 class="mb-2">
        ¿Desea eliminar esta clase?
    </h4>

    <!-- NOMBRE DE LA CLASE -->
    <p class="fs-5">
        <strong>{{ clase.nombre }}</strong>
    </p>

    <!-- ADVERTENCIA -->
    <p class="text-muted">
        Esta acción no se puede deshacer.
    </p>

    <!-- FORMULARIO DE ELIMINACIÓN -->
    <form method="POST">
        <!-- Protección CSRF -->
        {% csrf_token %}

        <!-- BOTONES -->
        <div class="d-flex justify-content-center gap-3 mt-4">

            <!-- Confirmar eliminación -->
            <button class="btn btn-danger px-4">
                <i class="fa fa-trash"></i> Eliminar
            </button>

            <!-- Cancelar -->
            <a href="{% url 'inicio' %}" class="btn btn-outline-secondary px-4">
                Cancelar
            </a>

        </div>
    </form>

</div>

</body>
</html>
