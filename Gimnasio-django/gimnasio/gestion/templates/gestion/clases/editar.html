
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Editar Clase</title>

    <!-- Bootstrap 5: estilos responsivos y componentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome: iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ===============================
           FONDO DE LA PÁGINA
           ===============================
           - Aplica una imagen de fondo
           - Se oscurece con un degradado
           - La imagen queda fija y centrada
        */
        body{
            background:
                linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.6)),
                url("https://inticap.com/portal/images/sistema/facturacion/logos/Sistema_Gimnasio.png")
                no-repeat center center fixed;
            background-size: cover;
        }

        /* ===============================
           TARJETA DEL FORMULARIO
           ===============================
           - Contenedor principal del formulario
           - Color amarillo para diferenciar edición
        */
        .form-card{
            width: 30%;
            max-width: 1400px;
            background: #fff3cd;
            border: 5px solid #ffc107;
            border-radius: 25px;
            padding: 40px;
        }

        /* ===============================
           ETIQUETAS DE LOS CAMPOS
           =============================== */
        .form-label{
            font-weight: bold;
            text-align: center;
            display: block;
        }

        /* ===============================
           CAMPOS DEL FORMULARIO
           ===============================
           - Inputs, selects y textarea centrados
        */
        input, select, textarea{
            text-align: center;
        }

        /* ===============================
           CAMPO DESCRIPCIÓN
           =============================== */
        textarea{
            min-height: 180px;
            resize: vertical;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100">
<!--
    - d-flex: activa flexbox
    - justify-content-center: centra horizontalmente
    - align-items-center: centra verticalmente
    - min-vh-100: ocupa toda la pantalla
-->

<!-- CONTENEDOR PRINCIPAL -->
<div class="form-card shadow-lg">

    <!-- TÍTULO DEL FORMULARIO -->
    <h2 class="text-center mb-4 text-warning">
        <i class="fa fa-edit"></i> Editar Clase
    </h2>

    <!-- FORMULARIO DE EDICIÓN -->
    <form method="POST">
        <!-- Protección CSRF obligatoria en Django -->
        {% csrf_token %}

        <!-- ===============================
             CAMPOS NORMALES DEL FORMULARIO
             ===============================
             - Recorre todos los campos
             - Excluye el campo "descripcion"
        -->
        {% for field in formulario %}
            {% if field.name != "descripcion" %}
                <div class="mb-4 text-center">
                    <!-- Etiqueta del campo -->
                    <label class="form-label">{{ field.label }}</label>

                    <!-- Campo centrado y ancho controlado -->
                    <div class="d-flex justify-content-center">
                        <div class="w-75">
                            {{ field }}
                        </div>
                    </div>
                </div>
            {% endif %}
        {% endfor %}

        <!-- ===============================
             CAMPO DESCRIPCIÓN (AL FINAL)
             =============================== -->
        {% for field in formulario %}
            {% if field.name == "descripcion" %}
                <div class="mb-4 text-center">
                    <label class="form-label">{{ field.label }}</label>

                    <div class="d-flex justify-content-center">
                        <div class="w-75">
                            {{ field }}
                        </div>
                    </div>
                </div>
            {% endif %}
        {% endfor %}

        <!-- ===============================
             BOTONES DE ACCIÓN
             =============================== -->
        <div class="d-flex justify-content-center gap-3 mt-4">

            <!-- Botón para guardar cambios -->
            <button class="btn btn-warning px-5">
                <i class="fa fa-save"></i> Actualizar
            </button>

            <!-- Volver a la página principal -->
            <a href="{% url 'inicio' %}" class="btn btn-outline-secondary px-5">
                Volver
            </a>

        </div>

    </form>

</div>

</body>
</html>
