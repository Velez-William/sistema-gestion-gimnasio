
<!DOCTYPE html>
<html lang="es">
<head>

    <!-- ================= CONFIGURACIÓN BÁSICA ================= -->
    <meta charset="UTF-8">
    <title>Editar Miembro</title>

    <!-- ================= BOOTSTRAP ================= -->
    <!-- Framework CSS para diseño responsive -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ================= FONT AWESOME ================= -->
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- ================= ESTILOS PERSONALIZADOS ================= -->
    <style>

        /* ===== FONDO GENERAL ===== */
        body{
            min-height: 100vh;

            /* Imagen de fondo + capa oscura */
            background:
                linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
                url("https://inticap.com/portal/images/sistema/facturacion/logos/Sistema_Gimnasio.png")
                no-repeat center center fixed;

            background-size: cover;
        }

        /* ===== TARJETA DEL FORMULARIO ===== */
        .form-card{
            max-width: 650px;
            background: #fff3cd;
            border: 5px solid #ffc107;
            width: 100%;
            border-radius: 15px;
            padding: 40px;
        }

    </style>

</head>

<body class="d-flex justify-content-center align-items-center">

<!-- ================= TARJETA CENTRAL ================= -->
<div class="card shadow-lg p-5 form-card">

    <!-- ===== TÍTULO ===== -->
    <h2 class="text-center mb-4">
        <i class="fa fa-user-plus text-warning fa-2x"></i><br>
        <strong>Editar Miembro</strong>
    </h2>

    <!-- ================= FORMULARIO ================= -->
    <form method="POST">
        {% csrf_token %}

        <!-- Recorre los campos del formulario -->
        {% for field in formulario %}
            <div class="mb-4">

                <!-- Etiqueta del campo -->
                <label class="form-label fw-semibold">
                    {{ field.label }}
                </label>

                <!-- Campo grande y elegante -->
                <input
                    type="{{ field.field.widget.input_type }}"
                    name="{{ field.name }}"
                    class="form-control form-control-lg"
                    value="{{ field.value|default_if_none:'' }}"
                    {% if field.field.required %}required{% endif %}
                >

                <!-- Errores -->
                {% if field.errors %}
                    <div class="text-danger small mt-1">
                        {{ field.errors }}
                    </div>
                {% endif %}

            </div>
        {% endfor %}

        <!-- Botón actualizar -->
        <button class="btn btn-warning btn-lg w-100">
            <i class="fa fa-save"></i> Actualizar Miembro
        </button>

    </form>

    <!-- ===== VOLVER ===== -->
    <div class="text-center mt-4">
        <a href="{% url 'inicio' %}" class="text-decoration-none">
            <i class="fa fa-arrow-left"></i> Volver al inicio
        </a>
    </div>

</div>

</body>
</html>
