
<!-- Cargamos la librería static de Django para usar imágenes, CSS, JS -->

<!DOCTYPE html>
<html lang="es">
<head>

    <!-- Codificación para soportar acentos -->
    <meta charset="UTF-8">

    <!-- Título que se muestra en la pestaña -->
    <title>Nuevo Miembro</title>

    <!-- Bootstrap 5 (estilos y diseño responsive) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome (íconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Estilos propios -->
    <style>

        /* Fondo general con imagen + capa oscura */
        body{
            background:
                linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
                url("https://inticap.com/portal/images/sistema/facturacion/logos/Sistema_Gimnasio.png") no-repeat center center fixed;
            background-size: cover;
        }

        /* Tarjeta del formulario */
        .form-card{
            max-width: 650px;   /* Ancho máximo */
            border-radius: 18px; /* Bordes redondeados */
            border: 5px solid #20c997;
            padding: 40px;
            width: 30%;
            background: #f0fdfa;
        }

    </style>
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100">
<!--
    d-flex + justify-content-center + align-items-center
    → centra el formulario vertical y horizontalmente
-->

<!-- Tarjeta principal -->
<div class="card shadow-lg p-5 form-card bg-white">

    <!-- Título del formulario -->
    <h2 class="text-center mb-4">
        <i class="fa fa-user-plus text-success fa-2x"></i><br>
        <strong>Registrar Nuevo Miembro</strong>
    </h2>

    <!-- Formulario Django -->
    <form method="POST">

        <!-- Token de seguridad obligatorio -->
        {% csrf_token %}

        <!-- Recorremos todos los campos del formulario -->
        {% for field in formulario %}

            <div class="mb-4">

                <!-- Etiqueta del campo -->
                <label class="form-label fw-semibold">
                    {{ field.label }}
                </label>

                <!-- Input manual con clases Bootstrap -->
                <input
                    type="{{ field.field.widget.input_type }}"
                    name="{{ field.name }}"
                    class="form-control form-control-lg"
                    value="{{ field.value|default_if_none:'' }}"
                    {% if field.field.required %}required{% endif %}
                >

                <!-- Mensajes de error -->
                {% if field.errors %}
                    <div class="text-danger small mt-1">
                        {{ field.errors }}
                    </div>
                {% endif %}

            </div>

        {% endfor %}

        <!-- Botón Guardar -->
        <button class="btn btn-success btn-lg w-100">
            <i class="fa fa-save"></i> Guardar Miembro
        </button>

    </form>

    <!-- Enlace para volver -->
    <div class="text-center mt-4">
        <a href="{% url 'inicio' %}" class="text-decoration-none">
            <i class="fa fa-arrow-left"></i> Volver
        </a>
    </div>

</div>

</body>
</html>
